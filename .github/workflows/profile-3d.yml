name: GitHub Profile Assets

on:
  schedule:
    - cron: "0 6 * * 0"   # semanal (domingo), 06:00 UTC (03:00 BRT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Snapshot streak card as static SVG
        run: |
          mkdir -p assets

          download() {
            local url="$1" out="$2" tmp
            tmp="$(mktemp)"
            if curl -sSL --max-time 30 --retry 3 --retry-delay 5 "$url" -o "$tmp" \
               && head -c 200 "$tmp" | grep -q "<svg" \
               && ! grep -qi "something went wrong\|Maximum retries exceeded" "$tmp"; then
              mv "$tmp" "$out"
              echo "OK   -> $out"
            else
              echo "SKIP -> $out (resposta inválida, mantendo versão anterior)"
              rm -f "$tmp"
            fi
          }

          # stats.svg e top-langs.svg são gerados pelo workflow readme-stats.yml (fork próprio)
          download "https://github-readme-streak-stats.herokuapp.com/?user=jaksonlima&theme=tokyonight&hide_border=true&background=1A1B26" assets/streak.svg

      - name: Commit & push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets
          git diff --staged --quiet || git commit -m "chore: update profile stats and skyline"
          git push
