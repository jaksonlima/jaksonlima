name: Profile · Skyline Rotate (manhã/noite)

on:
  schedule:
    - cron: "0 1,11 * * *"   # 22h e 08h BRT (01h e 11h UTC)
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick skyline variant (dark de manhã, clara à noite)
        run: |
          DARK=(
            profile-night-view.svg
            profile-night-green.svg
            profile-night-rainbow.svg
          )
          LIGHT=(
            profile-gitblock.svg
            profile-green.svg
            profile-green-animate.svg
            profile-season.svg
            profile-season-animate.svg
            profile-south-season.svg
            profile-south-season-animate.svg
          )

          UTC_HOUR=$(date -u +%H)
          BRT_HOUR=$(( (10#$UTC_HOUR - 3 + 24) % 24 ))

          if [ "$BRT_HOUR" -lt 12 ]; then
            PICK="${DARK[$(( RANDOM % ${#DARK[@]} ))]}"
            PERIOD="manhã (dark)"
          else
            PICK="${LIGHT[$(( RANDOM % ${#LIGHT[@]} ))]}"
            PERIOD="noite (clara)"
          fi

          SRC="profile-3d-contrib/${PICK}"
          echo "BRT ${BRT_HOUR}h · ${PERIOD} -> ${PICK}"

          mkdir -p assets
          if [ -f "$SRC" ]; then
            cp "$SRC" assets/skyline.svg
            echo "OK -> assets/skyline.svg ($(wc -c <assets/skyline.svg)b)"
          else
            echo "FONTE AUSENTE: $SRC (rode o workflow do skyline 3D primeiro)"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg
          git diff --staged --quiet || git commit -m "chore: rotate skyline (manhã/noite)"
          git push
